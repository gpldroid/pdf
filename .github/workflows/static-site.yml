name: Static site validation

on:
  push:
    branches: [main, refactor/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate site structure
        run: node scripts/validate-site.mjs
      - name: Syntax check JavaScript
        run: find src/js scripts -name "*.js" -print0 | xargs -0 -n1 node --check
